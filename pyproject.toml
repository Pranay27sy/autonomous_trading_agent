[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promoter-tracker"
version = "0.3.0"
description = "Promoter buying and selling in NSE-listed stocks, and what the price did next"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "yfinance>=0.2.40,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "defusedxml>=0.7,<1",
    "filelock>=3.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
promoter-refresh = "promoter_tracker.refresh:main"

[tool.setuptools]
packages = ["promoter_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # random isn't used for security
    "UP035", # typing.Callable etc. are still fine on 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E731"]
